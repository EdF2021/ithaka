# Standalone AMD ROCm GPU Compose file for stack-management UIs (Portainer,
# Coolify, Dockhand, etc.) that accept only a single Compose file and do not
# reliably honor COMPOSE_FILE or multiple `-f` overlays.
#
# This is equivalent to: docker-compose.yml + docker/gpu.amd.yml.
# The base docker-compose.yml plus the docker/gpu.amd.yml overlay remain the
# source of truth — CLI users should keep using the COMPOSE_FILE overlay
# workflow. Keep this file in sync with both when either changes.
#
# Requires ROCm drivers on the host (kfd + DRI devices) and the host user
# running Docker in the `video` and `render` groups. Set RENDER_GID to your
# host's numeric render group id when needed. See docker/gpu.amd.yml for details.
services:
  ithaka:
    build: .
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-7000}:7000"
    volumes:
      - ${APP_DATA_DIR:-./data}:/app/data:z
      - ${APP_LOGS_DIR:-./logs}:/app/logs:z
      # Cookbook remote-server SSH identity. Ithaka can generate a key here;
      # add the shown public key to each remote server's authorized_keys.
      - ${APP_DATA_DIR:-./data}/ssh:/app/.ssh:z
      # Cookbook local model cache. Inside Docker, "Local" means the Ithaka
      # container, so persist its HuggingFace cache under ./data/huggingface.
      - ${APP_DATA_DIR:-./data}/huggingface:/app/.cache/huggingface:z
      # npm/npx cache for MCP servers. Without this the cache dies on every
      # image rebuild, so npx-based MCP servers hit a cold (re)install inside
      # the 20s startup budget - killed installs leave corrupt _npx entries
      # ("<bin>: not found" forever). Persist it next to the other caches.
      - ${APP_DATA_DIR:-./data}/npm-cache:/app/.npm:z
      # Cookbook-installed Python CLIs/packages (vLLM, llama-cpp-python, etc.)
      # land under /app/.local for the ithaka user. Persist them so a
      # container recreate does not silently remove installed serve engines.
      - ${APP_DATA_DIR:-./data}/local:/app/.local:z
    extra_hosts:
      # Lets the container reach local services on the Docker host, including
      # Ollama at http://host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_HOSTS=${LLM_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - RESEARCH_LLM_ENDPOINT=${RESEARCH_LLM_ENDPOINT:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - LOCALHOST_BYPASS=${LOCALHOST_BYPASS:-false}
      - ITHAKA_ADMIN_USER=${ITHAKA_ADMIN_USER:-admin}
      - ITHAKA_ADMIN_PASSWORD=${ITHAKA_ADMIN_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - FASTEMBED_MODEL=${FASTEMBED_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
      - ITHAKA_INPROCESS_POLLERS=${ITHAKA_INPROCESS_POLLERS:-1}
      - ITHAKA_INPROCESS_TASKS=${ITHAKA_INPROCESS_TASKS:-1}
      - ITHAKA_SCRIPT_HOST=${ITHAKA_SCRIPT_HOST:-localhost}
      - ITHAKA_CHAT_UPLOAD_MAX_BYTES=${ITHAKA_CHAT_UPLOAD_MAX_BYTES:-10485760}
      - ITHAKA_GALLERY_UPLOAD_MAX_BYTES=${ITHAKA_GALLERY_UPLOAD_MAX_BYTES:-104857600}
      - ITHAKA_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES=${ITHAKA_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES:-26214400}
      - ITHAKA_MEMORY_IMPORT_MAX_BYTES=${ITHAKA_MEMORY_IMPORT_MAX_BYTES:-10485760}
      - ITHAKA_PERSONAL_UPLOAD_MAX_BYTES=${ITHAKA_PERSONAL_UPLOAD_MAX_BYTES:-26214400}
      - ITHAKA_EMAIL_COMPOSE_UPLOAD_MAX_BYTES=${ITHAKA_EMAIL_COMPOSE_UPLOAD_MAX_BYTES:-26214400}
      - ITHAKA_STT_MAX_AUDIO_BYTES=${ITHAKA_STT_MAX_AUDIO_BYTES:-26214400}
      - ITHAKA_MEETING_CHUNK_MAX_BYTES=${ITHAKA_MEETING_CHUNK_MAX_BYTES:-10485760}
      - ITHAKA_MEETING_AUDIO_MAX_BYTES=${ITHAKA_MEETING_AUDIO_MAX_BYTES:-524288000}
      - ITHAKA_ICS_MAX_BYTES=${ITHAKA_ICS_MAX_BYTES:-10485760}
      # Allow CalDAV account URLs that resolve to private IPs (needed for the
      # bundled DavMail gateway reachable as http://davmail:1080 inside the
      # compose network). Set to 0 if you don't run the davmail service.
      - ITHAKA_ALLOW_PRIVATE_CALDAV=${ITHAKA_ALLOW_PRIVATE_CALDAV:-1}
      - DATA_BRAVE_API_KEY=${DATA_BRAVE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      # PUID / PGID — the user/group the container drops to before
      # running uvicorn (entrypoint also chowns /app/data + /app/logs
      # to match, so bind-mounted files stay editable from the host).
      # 1000 is the default first user on most Linux installs. If your
      # host user has a different id, override here or via .env, e.g.:
      #   PUID=1001
      #   PGID=1001
      # Find yours with:  id -u  /  id -g
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped
    # AMD ROCm overlay (from docker/gpu.amd.yml).
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - ${RENDER_GID:-render}

  chromadb:
    image: docker.io/chromadb/chroma:latest
    ports:
      - "${CHROMADB_BIND:-127.0.0.1}:8100:8000"
    volumes:
      - chromadb-data:/data
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  searxng:
    # Pinned, not :latest — ithaka waits on searxng's healthcheck
    # (depends_on: condition: service_healthy), so a broken upstream `latest`
    # tag blocks the whole app from starting. 2026.6.2 crashes on boot with
    # `KeyError: 'default_doi_resolver'`, failing the healthcheck (issue #1414).
    # Bump this deliberately after verifying a newer tag boots clean.
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ] || grep -q 'ithaka-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    # The official searxng image runs as the non-root `searxng` user, but its
    # entrypoint still needs to chown /etc/searxng on first boot, drop privs via
    # su-exec, and (with our wrapper above) write settings.yml into the named
    # volume. Without these capabilities the wrapper aborts at the redirection
    # with EACCES and the container fails its healthcheck with permission
    # errors during setup. Mirrors the cap set recommended by the upstream
    # searxng-docker compose file. See issue #721.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ntfy:
    image: docker.io/binwiederhier/ntfy
    command: serve
    ports:
      - "${NTFY_BIND:-127.0.0.1}:8091:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    restart: unless-stopped

  # DavMail gateway: exposes a personal outlook.com / Microsoft 365 account as
  # plain IMAP (1143), SMTP (1025) and CalDAV (1080) inside the compose
  # network only (no host ports). Ithaka connects to hostname `davmail` with
  # the account's email address as username. First run requires a one-time
  # OAuth device-code login (watch `docker compose logs davmail` for the code,
  # then switch DAVMAIL_AUTHENTICATION to O365Modern via .env); the refresh token
  # persists in the davmail-config volume across restarts.
  davmail:
    # trunk i.p.v. 6.8.1: Graph-CalDAV NPE-fix (DateUtil null-tijdzone-guard) zit nog
    # niet in een release; terug naar een release-tag zodra er een versie > 6.8.1 is.
    image: docker.io/kran0/davmail-docker@sha256:fd6c60b89f5bb202434b764527cf1e625ea10b92ac204ae81a205912a05944fc # trunk-build 2026-08-29
    environment:
      - DAVMAIL_SERVER=true
      - DAVMAIL_MODE=${DAVMAIL_MODE:-O365EWS}
      - DAVMAIL_AUTHENTICATION=${DAVMAIL_AUTHENTICATION:-O365Modern}
      - DAVMAIL_ALLOWREMOTE=true
      # enableOidc switches DavMail to the Microsoft identity platform v2.0
      # endpoints - required for personal outlook.com accounts (AADSTS500201
      # on v1 otherwise).
      - "ADDITIONAL_PROPERTY_VALUES=davmail.oauth.persistToken=true\ndavmail.oauth.tenantId=${DAVMAIL_TENANT:-common}\ndavmail.enableOidc=${DAVMAIL_OIDC:-true}\ndavmail.enableGraph=${DAVMAIL_GRAPH:-true}"
    volumes:
      - davmail-config:/davmail-config
    restart: unless-stopped

  # Remote access over your private tailnet. Runs the official Tailscale
  # client in userspace mode on the host network, so inbound connections to
  # this node's Tailscale IP reach the app on localhost:7000. First run:
  # `docker compose logs tailscale` prints a login URL to authorize the node.
  tailscale:
    image: docker.io/tailscale/tailscale:latest
    hostname: ithaka
    network_mode: host
    # Run plain tailscaled instead of containerboot: containerboot's login
    # retry loop regenerates the node key (and thus the auth URL) every few
    # minutes, making interactive browser auth a race you can't win. With
    # bare tailscaled the key is generated once by a single `tailscale up`
    # and the printed auth URL stays valid until it is used.
    # --port=41642: the Windows host's own Tailscale client already uses UDP
    # 41641 behind the same NAT; sharing that port made peers pick a broken
    # router-hairpin path that dropped large packets (small responses passed,
    # full pages and TLS handshakes hung).
    entrypoint: ["tailscaled", "--tun=userspace-networking", "--statedir=/var/lib/tailscale", "--port=41642"]
    # The WSL<->Windows path silently drops packets over ~1200 bytes (probed
    # with `tailscale ping --size`: 1200 pong, 1300 timeout). Cap the tunnel
    # MTU so full-size data packets stay under that black hole.
    environment:
      - TS_DEBUG_MTU=1130
    volumes:
      - tailscale-state:/var/lib/tailscale
    restart: unless-stopped

volumes:
  searxng-data:
  chromadb-data:
  ntfy-cache:
  davmail-config:
  tailscale-state:
