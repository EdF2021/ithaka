# NVIDIA GPU overlay. Enable by setting COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker/gpu.nvidia.yml
#
# Use scripts/check-docker-gpu.sh to diagnose GPU passthrough, optionally
# install the NVIDIA Container Toolkit (Ubuntu/Debian), and write COMPOSE_FILE
# to .env. The script is read-only by default — it installs nothing and never
# edits .env unless explicitly asked.
#
# Requires the NVIDIA Container Toolkit on the host.
#   Arch:    sudo pacman -S nvidia-container-toolkit
#   Debian:  sudo apt install nvidia-container-toolkit
#   Fedora:  sudo dnf install nvidia-container-toolkit
# Then:
#   sudo nvidia-ctk runtime configure --runtime=docker
#   sudo systemctl restart docker
# Verify with:
#   docker info | grep -i nvidia
#
# This overlay passes the host GPU through to the container AND rebuilds the
# image with the CUDA 13 / cuDNN 9 userspace the built-in fastembed/onnxruntime
# embedding lane needs to actually use the GPU (RAG, semantic memory, tool
# selection) — see requirements-gpu-nvidia.txt and the Dockerfile's
# GPU_EXTRAS arg for the full rationale (~1.5-2GB image growth, opt-in only
# via this overlay). Cookbook model-serving engines (vLLM / llama-cpp-python /
# SGLang) are a separate concern — install those via Cookbook -> Dependencies
# (or pip) after enabling this overlay; they are not bundled here.
services:
  ithaka:
    build:
      args:
        GPU_EXTRAS: "1"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
